<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Área de Membros · ETA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/eta.css">
<style>
/* LOGIN */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px var(--gutter); background: url('assets/bg-neural.jpg') center/cover; }
.login-box { width: 100%; max-width: 400px; background: rgba(17,22,17,.92); border: 1px solid var(--border); border-radius: 14px; padding: 32px; backdrop-filter: blur(10px); }
.login-box .brand { margin-bottom: 24px; }
.login-box .brand-name { display: block; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--fg-muted); }
.field input, .field textarea { background: var(--bg); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; padding: 11px 13px; color: var(--fg); font: inherit; font-size: 15px; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--verde); }
.msg { font-size: 13px; min-height: 18px; margin-bottom: 10px; }
.msg.err { color: #f87171; } .msg.ok { color: var(--verde); }
.linkish { color: var(--verde); font-size: 13px; }

/* USER MENU */
.user-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--verde); color: #000; font-weight: 700; font-size: 14px; display: grid; place-items: center; }

/* LESSON PAGE */
.lesson-layout { max-width: 1400px; margin: 0 auto; padding: 24px var(--gutter) 48px; display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 28px; align-items: start; }
.player { aspect-ratio: 16/9; background: #000 center/cover; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--border); }
.player iframe { width: 100%; height: 100%; border: 0; display: block; }
.player-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(0,0,0,.65); padding: 20px; }
.player-empty b { font: 700 22px var(--font-d); display: block; margin-bottom: 6px; }
.crumbs { font-size: 13px; color: var(--fg-muted); margin: 20px 0 8px; }
.crumbs a:hover { color: var(--fg); }
.lesson-title { font: 800 clamp(26px,3.5vw,36px)/1.1 var(--font-d); margin-bottom: 12px; }
.lesson-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.lesson-desc { color: #c9d2c9; line-height: 1.7; max-width: 760px; white-space: pre-line; }
.materials { margin-top: 28px; }
.material { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--bg-2); font-size: 14px; }
.side { position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow-y: auto; }
.side-head { padding: 0 2px 12px; }
.side-head b { font: 700 18px var(--font-d); display: block; }
.btn-done.is-done { background: transparent; border: 1px solid var(--verde); color: var(--verde); }

@media (max-width: 1000px) {
  .lesson-layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; }
}
</style>
</head>
<body>

<div id="root"><div class="center-msg">Carregando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script>
const { esc, hours, plural, coverStyle } = etaUtil;
const root = document.getElementById('root');

const S = { user: null, profile: null, courses: [], enrolled: new Set(), progress: new Map(), outlines: {} };

// ───────── DATA ─────────
async function loadBase() {
  const uid = S.user.id;
  const [c, e, p, pr] = await Promise.all([
    eta.from('courses').select('*').eq('is_published', true).order('position'),
    eta.from('enrollments').select('course_id,status,expires_at').eq('user_id', uid),
    eta.from('progress').select('lesson_id,course_id,completed,watched_pct,last_watched').eq('user_id', uid),
    eta.from('profiles').select('*').eq('id', uid).maybeSingle()
  ]);
  S.courses = c.data || [];
  const now = Date.now();
  S.enrolled = new Set((e.data || []).filter(x => x.status === 'active' && (!x.expires_at || new Date(x.expires_at) > now)).map(x => x.course_id));
  S.progress = new Map((p.data || []).map(x => [x.lesson_id, x]));
  S.profile = pr.data || { full_name: '', email: S.user.email };
  await Promise.all(S.courses.map(loadOutline));
}

async function loadOutline(course) {
  const { data } = await eta.rpc('course_outline', { p_slug: course.slug });
  const mods = [];
  for (const r of data || []) {
    let m = mods.find(x => x.id === r.module_id);
    if (!m) mods.push(m = { id: r.module_id, title: r.module_title, lessons: [] });
    if (r.lesson_id) m.lessons.push({ id: r.lesson_id, title: r.lesson_title, duration_min: r.duration_min, is_free: r.is_free, module_id: r.module_id, module_title: r.module_title });
  }
  S.outlines[course.id] = mods;
}

const courseBySlug = slug => S.courses.find(c => c.slug === slug);
const lessonsOf = c => (S.outlines[c.id] || []).flatMap(m => m.lessons);
const hasAccess = (c, l) => S.enrolled.has(c.id) || (l && l.is_free);
function stats(c) {
  const ls = lessonsOf(c), done = ls.filter(l => S.progress.get(l.id)?.completed).length;
  return { total: ls.length, done, pct: ls.length ? Math.round(done / ls.length * 100) : 0 };
}
function nextLesson(c) {
  const ls = lessonsOf(c).filter(l => hasAccess(c, l));
  return ls.find(l => !S.progress.get(l.id)?.completed) || ls[0];
}
function findLesson(id) {
  for (const c of S.courses) { const l = lessonsOf(c).find(x => x.id === id); if (l) return { c, l }; }
  return {};
}

// ───────── LAYOUT ─────────
function shell(active, html) {
  const initial = (S.profile.full_name || S.user.email || '?').trim()[0].toUpperCase();
  root.innerHTML = `
  <nav class="nav">
    <a class="brand" href="#/"><div class="brand-icon">ETA</div><div class="brand-name">Escola de Tecnologias Assistidas</div></a>
    <div class="nav-links">
      <a class="nav-link ${active === 'home' ? 'active' : ''}" href="#/">Início</a>
      <a class="nav-link ${active === 'cursos' ? 'active' : ''}" href="#/cursos">Meus cursos</a>
      <a class="nav-link ${active === 'perfil' ? 'active' : ''}" href="#/perfil" title="Perfil"><span class="user-btn">${esc(initial)}</span></a>
    </div>
  </nav>
  ${html}
  <footer class="footer"><span>© 2026 Escola de Tecnologias Assistidas</span><button class="linkish" onclick="logout()">Sair</button></footer>`;
  window.scrollTo(0, 0);
}

function courseCard(c) {
  const st = stats(c), owned = S.enrolled.has(c.id);
  const href = owned ? `#/curso/${c.slug}` : `curso.html?c=${encodeURIComponent(c.slug)}`;
  return `
  <a class="card" href="${href}">
    <div class="card-cover" style="${coverStyle(c)}">
      ${owned ? (st.pct === 100 ? '<span class="card-badge ok">Concluído</span>' : '') : '<span class="card-badge">🔒 Conhecer</span>'}
    </div>
    <div class="card-body">
      <div class="card-tag">${esc(c.category)}</div>
      <div class="card-title">${esc(c.title)}</div>
      <div class="card-meta">${plural((S.outlines[c.id] || []).length, 'módulo', 'módulos')} · ${plural(st.total, 'aula', 'aulas')} · ${hours(c.duration_min)}</div>
      ${owned ? `<div class="bar"><i style="width:${st.pct}%"></i></div><div class="bar-label">${st.pct}% · ${st.done} de ${st.total} aulas</div>` : ''}
    </div>
  </a>`;
}

// ───────── PAGES ─────────
function pageHome() {
  const mine = S.courses.filter(c => S.enrolled.has(c.id));
  const others = S.courses.filter(c => !S.enrolled.has(c.id));
  const recent = [...S.progress.values()].sort((a, b) => new Date(b.last_watched) - new Date(a.last_watched));
  const featured = (recent[0] && S.courses.find(c => c.id === recent[0].course_id && S.enrolled.has(c.id))) || mine[0] || S.courses[0];

  const cont = [];
  for (const p of recent) {
    if (p.completed) continue;
    const { c, l } = findLesson(p.lesson_id);
    if (c && l && !cont.find(x => x.c.id === c.id)) cont.push({ c, l });
  }

  let hero = '';
  if (featured) {
    const st = stats(featured), nx = nextLesson(featured), owned = S.enrolled.has(featured.id);
    hero = `
    <header class="bg-hero" style="background-image:url('${featured.bg_url || 'assets/bg-neural.jpg'}')">
      <div class="hero-inner">
        <div>
          <div class="eyebrow">${owned && st.done ? 'Continue de onde parou' : esc(featured.category)}</div>
          <h1 class="h1">${esc(featured.title)}</h1>
          <p class="lead">${esc(featured.subtitle || featured.description)}</p>
          ${owned ? `<div style="max-width:420px;margin-bottom:24px"><div class="bar"><i style="width:${st.pct}%"></i></div><div class="bar-label" style="margin-top:8px">${st.pct}% concluído · ${st.done} de ${st.total} aulas</div></div>` : ''}
          <div class="actions">
            ${nx ? `<a class="btn btn-primary" href="#/aula/${nx.id}">▶ ${st.done ? 'Continuar' : 'Começar'}</a>` : ''}
            <a class="btn btn-ghost" href="#/curso/${featured.slug}">Página do curso</a>
          </div>
        </div>
        <div class="hero-cover" style="${coverStyle(featured)}"></div>
      </div>
    </header>`;
  }

  shell('home', `
    ${hero}
    <main class="wrap">
      ${cont.length ? `<section class="section"><div class="row-title">Continuar assistindo</div><div class="row">${cont.map(({ c, l }) => `
        <a class="card" href="#/aula/${l.id}">
          <div class="card-cover" style="${coverStyle(c)}"></div>
          <div class="card-body"><div class="card-tag">${esc(c.title)}</div><div class="card-title">${esc(l.title)}</div><div class="card-meta">${esc(l.module_title)}</div></div>
        </a>`).join('')}</div></section>` : ''}
      <section class="section"><div class="row-title">Meus cursos</div>
        ${mine.length ? `<div class="grid">${mine.map(courseCard).join('')}</div>` : '<p class="muted">Você ainda não tem cursos liberados. Veja os cursos disponíveis abaixo.</p>'}
      </section>
      ${others.length ? `<section class="section"><div class="row-title">Outros cursos da ETA</div><div class="grid">${others.map(courseCard).join('')}</div></section>` : ''}
    </main>`);
}

function pageCursos() {
  const mine = S.courses.filter(c => S.enrolled.has(c.id));
  shell('cursos', `<main class="wrap section"><h1 class="h2">Meus cursos</h1>
    ${mine.length ? `<div class="grid">${mine.map(courseCard).join('')}</div>` : '<p class="muted">Nenhum curso liberado na sua conta.</p>'}</main>`);
}

function curriculum(c, currentId) {
  const mods = S.outlines[c.id] || [];
  const curMod = currentId && mods.find(m => m.lessons.some(l => l.id === currentId));
  return mods.map((m, i) => {
    const done = m.lessons.filter(l => S.progress.get(l.id)?.completed).length;
    const open = curMod ? curMod.id === m.id : i === 0 || (done > 0 && done < m.lessons.length);
    return `
    <div class="mod ${open ? 'open' : ''}">
      <button class="mod-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="mod-title">${i + 1}. ${esc(m.title)}</span>
        <span class="mod-meta">${done}/${m.lessons.length}</span>
      </button>
      <div class="mod-body">
        ${m.lessons.map(l => {
          const ok = hasAccess(c, l), isDone = S.progress.get(l.id)?.completed;
          const inner = `
            <span class="les-ico ${isDone ? 'done' : ''}">${isDone ? '✓' : ok ? '▶' : '🔒'}</span>
            <span class="les-title">${esc(l.title)}</span>
            ${l.is_free && !S.enrolled.has(c.id) ? '<span class="tag-free">Grátis</span>' : ''}
            <span class="les-dur">${l.duration_min ? l.duration_min + ' min' : ''}</span>`;
          return ok
            ? `<a class="les ${l.id === currentId ? 'current' : ''}" href="#/aula/${l.id}">${inner}</a>`
            : `<div class="les lock">${inner}</div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function pageCurso(slug) {
  const c = courseBySlug(slug);
  if (!c) return shell('', '<div class="center-msg">Curso não encontrado.</div>');
  const st = stats(c), nx = nextLesson(c), owned = S.enrolled.has(c.id);
  const mods = S.outlines[c.id] || [];
  shell('cursos', `
    <header class="bg-hero" style="background-image:url('${c.bg_url || 'assets/bg-neural.jpg'}')">
      <div class="hero-inner">
        <div>
          <div class="eyebrow">${esc(c.category)}${c.level ? ' · ' + esc(c.level) : ''}</div>
          <h1 class="h1">${esc(c.title)}</h1>
          <p class="lead">${esc(c.subtitle || c.description)}</p>
          <div class="meta">
            <span>${plural(mods.length, 'módulo', 'módulos')}</span>
            <span>${plural(st.total, 'aula', 'aulas')}</span>
            <span>${hours(c.duration_min)} de conteúdo</span>
            <span>Com ${esc(c.instructor || 'Leonardo Dantas')}</span>
          </div>
          ${owned ? `<div style="max-width:420px;margin-bottom:24px"><div class="bar"><i style="width:${st.pct}%"></i></div><div class="bar-label" style="margin-top:8px">${st.pct}% concluído · ${st.done} de ${st.total} aulas</div></div>` : ''}
          <div class="actions">
            ${nx ? `<a class="btn btn-primary" href="#/aula/${nx.id}">▶ ${owned ? (st.done ? 'Continuar' : 'Começar o curso') : 'Assistir aula grátis'}</a>` : ''}
            ${owned ? '' : `<a class="btn btn-ghost" href="curso.html?c=${encodeURIComponent(c.slug)}">Conhecer o curso</a>`}
          </div>
        </div>
        <div class="hero-cover" style="${coverStyle(c)}"></div>
      </div>
    </header>
    <main class="wrap">
      ${(c.outcomes || []).length ? `<section class="section"><h2 class="h2">O que você vai aprender</h2><div class="outcomes">${c.outcomes.map(o => `<div class="outcome">${esc(o)}</div>`).join('')}</div></section>` : ''}
      <section class="section"><h2 class="h2">Conteúdo do curso</h2>${curriculum(c)}</section>
      ${c.description ? `<section class="section"><h2 class="h2">Sobre o curso</h2><p class="lead" style="max-width:720px">${esc(c.description)}</p></section>` : ''}
    </main>`);
}

async function pageAula(id) {
  const { c, l } = findLesson(id);
  if (!c) return shell('', '<div class="center-msg">Aula não encontrada.</div>');
  if (!hasAccess(c, l)) return shell('', `<div class="center-msg">Esta aula faz parte de <b>${esc(c.title)}</b> e não está liberada na sua conta.<br><br><a class="btn btn-primary" href="curso.html?c=${encodeURIComponent(c.slug)}">Conhecer o curso</a></div>`);

  shell('cursos', '<div class="center-msg">Carregando aula…</div>');
  const [{ data: full }, { data: mats }] = await Promise.all([
    eta.from('lessons').select('*').eq('id', id).maybeSingle(),
    eta.from('materials').select('*').eq('lesson_id', id)
  ]);
  if (location.hash !== '#/aula/' + id) return; // usuário navegou durante o carregamento

  // registra que a aula foi aberta (para "Continuar assistindo")
  const prev = S.progress.get(id);
  const row = { user_id: S.user.id, lesson_id: id, course_id: c.id, completed: prev?.completed || false, watched_pct: prev?.watched_pct || 0, last_watched: new Date().toISOString() };
  S.progress.set(id, row);
  eta.from('progress').upsert(row, { onConflict: 'user_id,lesson_id' }).then(() => {});

  const all = lessonsOf(c).filter(x => hasAccess(c, x));
  const idx = all.findIndex(x => x.id === id), prevL = all[idx - 1], nextL = all[idx + 1];
  const video = full?.panda_video_id && ETA_CONFIG.PANDA_EMBED_BASE
    ? `<iframe src="${ETA_CONFIG.PANDA_EMBED_BASE}${encodeURIComponent(full.panda_video_id)}" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe>`
    : `<div class="player-empty"><div><b>Vídeo em breve</b><span class="muted">O vídeo desta aula ainda não foi publicado.</span></div></div>`;

  shell('cursos', `
    <div class="lesson-layout">
      <div>
        <div class="player" style="${coverStyle(c)}">${video}</div>
        <div class="crumbs"><a href="#/curso/${c.slug}">${esc(c.title)}</a> › ${esc(l.module_title)}</div>
        <h1 class="lesson-title">${esc(l.title)}</h1>
        <div class="lesson-bar">
          <button class="btn btn-primary btn-sm btn-done ${row.completed ? 'is-done' : ''}" id="btnDone">${row.completed ? '✓ Concluída' : 'Marcar como concluída'}</button>
          <div class="actions">
            ${prevL ? `<a class="btn btn-ghost btn-sm" href="#/aula/${prevL.id}">← Anterior</a>` : ''}
            ${nextL ? `<a class="btn btn-ghost btn-sm" href="#/aula/${nextL.id}">Próxima →</a>` : ''}
          </div>
        </div>
        ${full?.description ? `<p class="lesson-desc">${esc(full.description)}</p>` : ''}
        ${(mats || []).length ? `<div class="materials"><div class="row-title">Materiais</div>${mats.map(m => `
          <div class="material"><span>${esc(m.title)}</span><a class="linkish" href="${esc(m.url)}" target="_blank" rel="noopener">Abrir</a></div>`).join('')}</div>` : ''}
      </div>
      <aside class="side">
        <div class="side-head"><b>${esc(c.title)}</b><span class="bar-label">${stats(c).pct}% concluído</span></div>
        ${curriculum(c, id)}
      </aside>
    </div>`);

  document.getElementById('btnDone').onclick = async () => {
    row.completed = !row.completed;
    row.watched_pct = row.completed ? 100 : row.watched_pct;
    const { error } = await eta.from('progress').upsert(row, { onConflict: 'user_id,lesson_id' });
    if (error) { row.completed = !row.completed; alertMsg('Não foi possível salvar o progresso.'); return; }
    if (row.completed && nextL) location.hash = '#/aula/' + nextL.id; else pageAula(id);
  };
}

function pagePerfil() {
  const p = S.profile;
  shell('perfil', `
    <main class="wrap section" style="max-width:560px">
      <h1 class="h2">Meu perfil</h1>
      <div class="field"><label>E-mail</label><input value="${esc(S.user.email)}" disabled></div>
      <div class="field"><label for="pName">Nome</label><input id="pName" value="${esc(p.full_name)}"></div>
      <div class="field"><label for="pBio">Sobre você</label><textarea id="pBio" rows="4">${esc(p.bio)}</textarea></div>
      <div class="msg" id="pMsg"></div>
      <button class="btn btn-primary" id="pSave">Salvar</button>

      <h2 class="h2" style="margin-top:48px">Trocar senha</h2>
      <div class="field"><label for="pPass">Nova senha</label><input id="pPass" type="password" autocomplete="new-password" minlength="8"></div>
      <div class="msg" id="pwMsg"></div>
      <button class="btn btn-ghost" id="pwSave">Atualizar senha</button>
    </main>`);
  document.getElementById('pSave').onclick = async () => {
    const full_name = document.getElementById('pName').value.trim(), bio = document.getElementById('pBio').value.trim();
    const { error } = await eta.from('profiles').update({ full_name, bio }).eq('id', S.user.id);
    const m = document.getElementById('pMsg');
    if (error) { m.className = 'msg err'; m.textContent = 'Erro ao salvar.'; return; }
    Object.assign(S.profile, { full_name, bio }); m.className = 'msg ok'; m.textContent = 'Perfil salvo.';
  };
  document.getElementById('pwSave').onclick = async () => {
    const password = document.getElementById('pPass').value, m = document.getElementById('pwMsg');
    if (password.length < 8) { m.className = 'msg err'; m.textContent = 'Use pelo menos 8 caracteres.'; return; }
    const { error } = await eta.auth.updateUser({ password });
    m.className = 'msg ' + (error ? 'err' : 'ok'); m.textContent = error ? error.message : 'Senha atualizada.';
  };
}

function alertMsg(t) { const d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#7f1d1d;padding:12px 18px;border-radius:8px;z-index:99'; document.body.appendChild(d); setTimeout(() => d.remove(), 3500); }

// ───────── LOGIN ─────────
function pageLogin() {
  root.innerHTML = `
  <div class="login">
    <form class="login-box" id="fLogin">
      <a class="brand" href="index.html"><div class="brand-icon">ETA</div><div class="brand-name">Escola de Tecnologias Assistidas</div></a>
      <div class="field"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="email" required></div>
      <div class="field"><label for="lPass">Senha</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <div class="msg" id="lMsg"></div>
      <button class="btn btn-primary" style="width:100%" id="lBtn">Entrar</button>
      <p style="margin-top:16px;text-align:center"><button type="button" class="linkish" id="lForgot">Esqueci minha senha</button></p>
    </form>
  </div>`;
  const msg = (t, ok) => { const m = document.getElementById('lMsg'); m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; };
  document.getElementById('fLogin').onsubmit = async e => {
    e.preventDefault();
    const btn = document.getElementById('lBtn'); btn.disabled = true; btn.textContent = 'Entrando…';
    const { error } = await eta.auth.signInWithPassword({ email: lEmail.value.trim(), password: lPass.value });
    btn.disabled = false; btn.textContent = 'Entrar';
    if (error) msg(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message);
  };
  document.getElementById('lForgot').onclick = async () => {
    const email = lEmail.value.trim();
    if (!email) return msg('Digite seu e-mail acima.');
    const { error } = await eta.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] + '#/perfil' });
    msg(error ? error.message : 'Enviamos um link para o seu e-mail.', !error);
  };
}

async function logout() { await eta.auth.signOut(); }

// ───────── ROUTER ─────────
function route() {
  if (!S.user) return pageLogin();
  const h = location.hash.replace(/^#\/?/, '').split('/');
  if (h[0] === 'curso' && h[1]) return pageCurso(decodeURIComponent(h[1]));
  if (h[0] === 'aula' && h[1]) return pageAula(h[1]);
  if (h[0] === 'cursos') return pageCursos();
  if (h[0] === 'perfil') return pagePerfil();
  pageHome();
}
window.addEventListener('hashchange', route);

let booted = false;
eta.auth.onAuthStateChange(async (event, session) => {
  const uid = session?.user?.id;
  if (uid && S.user?.id === uid && booted) return;
  S.user = session?.user || null;
  if (S.user) { root.innerHTML = '<div class="center-msg">Carregando seus cursos…</div>'; await loadBase(); }
  booted = true;
  route();
});
</script>
</body>
